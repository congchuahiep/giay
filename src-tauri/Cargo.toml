[package]
name = "giay"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "A Tauri App"
repository = ""
license = ""

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "giay_lib"

[dependencies]
keyring = "4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
